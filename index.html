<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Signature de devis · Perrin Toiture &amp; Rénovation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --ink:#14181F; --blue:#2A56B0; --blue-soft:#E9F0FC; --bg:#EEF1F6; --panel:#FFFFFF;
  --muted:#5B6575; --line:#D8DEE8; --ok:#1D6B35; --ok-soft:#DDF1E3; --warn:#9A4A00; --warn-soft:#FFE9D4; --danger:#B3261E;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.3px;margin:0}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
.topbar{background:var(--ink);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:4px solid var(--blue);color:#fff;font-weight:600}
.topbar span{display:block;max-width:760px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.head img{display:block;width:150px;max-width:100%;height:auto;margin-bottom:8px}
.co strong{display:block;font-size:17px}
.co div{color:var(--muted);white-space:pre-line}
.ttl{text-align:right;margin-left:auto}
.ttl h1{font-size:44px;line-height:.95;color:var(--ink)}
.ttl .num{display:inline-block;margin-top:8px;background:var(--blue);color:#fff;font-weight:700;padding:3px 10px;border-radius:4px}
.ttl .dates{color:var(--muted);margin-top:8px;font-size:14.5px}
.client{margin-top:18px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:0 8px 8px 0;padding:10px 14px}
.client .lbl{font-size:12.5px;color:var(--muted)}
.client div{white-space:pre-line}
.infos{display:grid;gap:4px;margin-top:14px;padding:10px 0;border-block:1px solid var(--line)}
.infos span{color:var(--muted)}
.lines{margin-top:14px;display:grid}
.lh,.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lh{background:var(--ink);color:#fff;font-weight:600;font-size:13px;border-radius:6px 6px 0 0;border-bottom:0;padding:8px 10px}
.ln .t{font-weight:600}
.ln .d{color:var(--muted);font-size:14px;white-space:pre-line;grid-column:1}
.ln .q{color:var(--muted);font-size:14px;grid-column:1}
.ln .a{grid-column:2;grid-row:1/span 3;align-self:start;text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{margin:16px 0 0 auto;width:min(340px,100%);display:grid;gap:4px}
.tot .r{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.tot .amb{color:var(--blue);font-weight:600}
.tot .amb small{display:block;color:var(--muted);font-weight:400}
.tot .ttc{display:flex;justify-content:space-between;align-items:center;margin-top:6px;background:var(--ink);color:#fff;padding:11px 14px;border-radius:8px;border-left:6px solid var(--blue);font-size:19px;font-weight:700}
.tot .dep{display:flex;justify-content:space-between;gap:10px;margin-top:6px;padding:8px 12px;border:1.5px dashed var(--blue);border-radius:8px;font-weight:600}
.notes{margin-top:18px;display:grid;gap:10px;font-size:14px;color:var(--muted);white-space:pre-line}
.notes h4{margin:0 0 2px;color:var(--ink);font-size:14px}
.cancel{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.4}
.legal{margin-top:16px;padding-top:10px;border-top:2px solid var(--ink);text-align:center;font-size:12.5px;color:var(--muted)}
.legal strong{color:var(--ink)}
h2.s{font-size:26px;margin-bottom:4px}
.hint{color:var(--muted);font-size:14.5px;margin:0 0 12px}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted);font-weight:500;margin-bottom:12px}
input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
input[type=text]:focus-visible,button:focus-visible,a.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px;font-size:15px}
.chk input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--blue)}
.pad{position:relative;background:#fff;border:2px dashed #9FB0CC;border-radius:12px;height:210px;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;cursor:crosshair;touch-action:none}
.pad .ph{position:absolute;left:0;right:0;bottom:20px;text-align:center;color:#9AA6B6;pointer-events:none}
.pad .base{position:absolute;left:18px;right:18px;bottom:46px;border-bottom:1.5px solid var(--line);pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff;font-size:17px;padding:14px 18px;flex:1 1 220px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:10px;font-size:15px}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.msg.err{background:#F8E0DE;color:#9A2A20}
.sigthumb{display:block;width:100%;max-height:110px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;margin:10px 0}
.step{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.step .c{flex:1;display:grid;gap:8px}
textarea.code{width:100%;min-height:70px;font:12px/1.3 ui-monospace,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
[hidden]{display:none!important}
input[type=email]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
input[type=email]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.pdfhost{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:var(--ink)}
.pdfhost .card{border:0;border-radius:0;padding:36px 44px 12px}
.pdfhost .signedblk{padding:0 44px 36px;display:grid;gap:4px;justify-items:start}
.pdfhost .signedblk .bpa{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--blue);font-size:20px}
.pdfhost .signedblk img{height:80px;width:auto;max-width:320px;object-fit:contain}
.pdfhost .signedblk .who{color:var(--muted);font-size:13px}
@media (max-width:480px){.ttl{text-align:left;margin-left:0}.ttl h1{font-size:38px}}
</style>
</head>

/* ---------- Lecture du lien ---------- */
function b64uToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u;}
async function readLink(){
  const h=location.hash.replace(/^#/,'');
  if(!h) return null;
  if(h[0]==='z'){
    if(!window.DecompressionStream) throw new Error('nav');
    const ds=new Blob([b64uToBytes(h.slice(1))]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const o=JSON.parse(await new Response(ds).text());
    return {
      q:{number:o.n,date:o.d,validity:o.v||15,object:o.o||'',startDate:o.s||'',duration:o.u||'',clientName:o.cn||'',clientAddress:o.ca||'',
         terms:o.t||PAY_TERMS,notes:o.x||'',discount:o.di||0,deposit:o.de||0,ambValue:o.av||0,ambType:o.at||'%',ambName:o.an||'',
         items:(o.i||[]).map(r=>({title:r[0],detail:r[1],qty:r[2],unit:r[3],price:r[4],vat:r[5]||0}))},
      c:{...CO,phone:o.p||CO.phone,email:o.e||CO.email,noVat:!o.nv,...(o.k||{})}
    };
  }
  const p=JSON.parse(new TextDecoder().decode(b64uToBytes(h)));
  return {q:{validity:15,terms:PAY_TERMS,ambType:'%',items:[],...p.q}, c:{...CO,...(p.c||{})}};
}

/* ---------- Totaux (mêmes règles que l'appli) ---------- */
function totals(q,noVat){
  const d=(+q.discount||0)/100; let ht=0; const byRate={};
  q.items.forEach(it=>{const l=(+it.qty||0)*(+it.price||0); ht+=l; const r=noVat?0:(+it.vat||0); byRate[r]=(byRate[r]||0)+l*(1-d)*r/100;});
  const disc=ht*d, net=ht-disc, tva=Object.values(byRate).reduce((a,b)=>a+b,0), ttc0=net+tva;
  const av=+q.ambValue||0; let amb=q.ambType==='€'?av:ttc0*av/100; amb=Math.min(Math.max(amb,0),ttc0);
  const ttc=ttc0-amb;
  return {ht,disc,net,byRate,amb,ttc,dep:ttc*(+q.deposit||0)/100};
}

/* ---------- Affichage du devis ---------- */
function quoteHTML(q,c){
  const noVat=!!c.noVat, t=totals(q,noVat), T=noVat?'TTC':'HT';
  const items=q.items.filter(it=>it.title||it.detail||+it.price);
  const rows=items.map(it=>`<div class="ln"><div class="t">${esc(it.title)}</div><div class="a">${eur((+it.qty||0)*(+it.price||0))}</div>
    ${it.detail?`<div class="d">${esc(it.detail)}</div>`:''}
    <div class="q">${num(it.qty)} ${esc(it.unit)} × ${eur(+it.price)} ${T}${noVat?'':' · TVA '+num(it.vat)+' %'}</div></div>`).join('');
  const vatRows=Object.entries(t.byRate).filter(([r])=>+r>0).sort((a,b)=>b[0]-a[0]).map(([r,v])=>`<div class="r"><span>TVA ${num(r)} %</span><span>${eur(v)}</span></div>`).join('');
  const disc=t.disc?`<div class="r"><span>Remise ${num(q.discount)} %</span><span>− ${eur(t.disc)}</span></div>`:'';
  const infos=[q.object&&`<div><span>Objet :</span> <b>${esc(q.object)}</b></div>`,
    q.startDate&&`<div><span>Début des travaux prévu :</span> <b>${fmtDate(q.startDate)}</b></div>`,
    q.duration&&`<div><span>Durée estimée :</span> <b>${esc(q.duration)}</b></div>`].filter(Boolean).join('');
  return `<section class="card">
    <div class="head">
      <div class="co">${c.name===CO.name?`<img src="${LOGO}" alt="Perrin Toiture &amp; Rénovation">`:''}<strong>${esc(c.name)}</strong>
        <div>${esc(c.address)}</div><div>${[c.phone&&('Tél. '+c.phone),c.email].filter(Boolean).map(esc).join('\n')}</div>${c.siret?`<div>SIRET ${esc(c.siret)}</div>`:''}</div>
      <div class="ttl"><h1>DEVIS</h1><div class="num">N° ${esc(q.number)}</div>
        <div class="dates">Date : ${fmtDate(q.date)}<br>Valable jusqu'au ${fmtDate(addDays(q.date,q.validity))}</div></div>
    </div>
    <div class="client"><div class="lbl">Client</div><strong>${esc(q.clientName)}</strong><div>${esc(q.clientAddress)}</div></div>
    ${infos?`<div class="infos">${infos}</div>`:''}
    <div class="lines"><div class="lh"><span>Désignation</span><span>Total ${T}</span></div>${rows||'<div class="ln"><div class="t">Aucune prestation</div></div>'}</div>
    <div class="tot">
      ${noVat?((t.disc||t.amb)?`<div class="r"><span>Sous-total TTC</span><span>${eur(t.ht)}</span></div>`:'')+disc
            :`<div class="r"><span>Total HT</span><span>${eur(t.ht)}</span></div>`+disc+(t.disc?`<div class="r"><span>Net HT</span><span>${eur(t.net)}</span></div>`:'')+vatRows}
      ${t.amb?`<div class="r amb"><span>Remise ambassadeur${q.ambType==='%'?' '+num(q.ambValue)+' %':''}${q.ambName?'<small>'+esc(q.ambName)+'</small>':''}</span><span>− ${eur(t.amb)}</span></div>`:''}
      <div class="ttc"><span>Total TTC</span><span>${eur(t.ttc)}</span></div>
      ${+q.deposit?`<div class="dep"><span>Acompte à la commande (${num(q.deposit)} %)</span><span>${eur(t.dep)}</span></div>`:''}
    </div>
    <div class="notes">${q.terms?`<div><h4>Conditions de paiement</h4>${esc(q.terms)}</div>`:''}${q.notes?`<div><h4>Notes</h4>${esc(q.notes)}</div>`:''}</div>
    ${c.cancel?`<div class="cancel"><b>Conditions d'annulation :</b> ${esc(c.cancel).replace(/\n+/g,' ')}</div>`:''}
    <div class="legal"><strong>Devis valable ${+q.validity||15} jours à compter de sa date d'émission. ${noVat?'TVA non applicable, art. 293 B du CGI.':''}</strong><br>${[c.name,c.siret&&('SIRET '+c.siret)].filter(Boolean).map(esc).join(' – ')}${c.footer?'<br>'+esc(c.footer).replace(/\n/g,'<br>'):''}</div>
  </section>`;
}

/* ---------- Signature ---------- */
let DATA=null, strokes=[], drawing=false, cv, ctx, dpr=1;
const storeKey=n=>'devis-signe-v2-'+n;
function loadSigned(n){try{return JSON.parse(localStorage.getItem(storeKey(n))||'null');}catch(e){return null;}}
function saveSigned(n,o,sent,email){try{localStorage.setItem(storeKey(n),JSON.stringify({o,sent:!!sent,email:email||''}));}catch(e){}}

function signFormHTML(q,expired){
  return `<section class="card" id="signCard">
    <h2 class="s">Signer ce devis</h2>
    <p class="hint">Signez avec le doigt (ou la souris), puis envoyez le fichier à Perrin Toiture &amp; Rénovation.</p>
    ${expired?`<div class="msg warn" style="margin-bottom:12px">La date de validité de ce devis est dépassée. Contactez-nous avant de signer.</div>`:''}
    <label class="f">Votre nom et prénom<input type="text" id="sName" autocomplete="name" value="${esc(q.clientName)}"></label>
    <label class="f">Votre e-mail (facultatif, pour recevoir une copie du devis signé)<input type="email" id="sMail" autocomplete="email" inputmode="email" placeholder="nom@exemple.fr"></label>
    <label class="chk"><input type="checkbox" id="sOk"><span>Je reconnais avoir lu ce devis et je le signe avec la mention « Bon pour accord ».</span></label>
    <div class="pad" id="pad"><canvas id="cv" aria-label="Zone de signature"></canvas><div class="base"></div><div class="ph" id="ph">Signez ici</div></div>
    <div class="row"><button class="btn" id="sClear" type="button">Effacer</button>
      <button class="btn main" id="sGo" type="button" disabled>Signer le devis</button></div>
    <div class="msg err" id="sErr" hidden style="margin-top:12px"></div>
  </section>`;
}
function setupPad(){
  cv=$('#cv'); ctx=cv.getContext('2d');
  const fit=()=>{const r=cv.getBoundingClientRect(); dpr=window.devicePixelRatio||1; cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); redraw();};
  const pt=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('pointerdown',e=>{e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing=true; strokes.push([pt(e)]); redraw(); upd();});
  cv.addEventListener('pointermove',e=>{if(!drawing) return; e.preventDefault(); strokes[strokes.length-1].push(pt(e)); redraw();});
  const end=e=>{drawing=false;}; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  window.addEventListener('resize',fit); fit();
  $('#sClear').onclick=()=>{strokes=[]; redraw(); upd();};
  $('#sName').oninput=upd; $('#sOk').onchange=upd; $('#sGo').onclick=doSign;
  upd();
}
function paint(c2,w,h,scale){
  c2.clearRect(0,0,w,h); c2.lineCap='round'; c2.lineJoin='round'; c2.strokeStyle='#14181F'; c2.fillStyle='#14181F'; c2.lineWidth=2.6*scale;
  strokes.forEach(s=>{ if(s.length===1){c2.beginPath(); c2.arc(s[0][0]*scale,s[0][1]*scale,1.6*scale,0,7); c2.fill(); return;}
    c2.beginPath(); c2.moveTo(s[0][0]*scale,s[0][1]*scale);
    for(let i=1;i<s.length-1;i++){const mx=(s[i][0]+s[i+1][0])/2,my=(s[i][1]+s[i+1][1])/2; c2.quadraticCurveTo(s[i][0]*scale,s[i][1]*scale,mx*scale,my*scale);}
    const l=s[s.length-1]; c2.lineTo(l[0]*scale,l[1]*scale); c2.stroke(); });
}
function redraw(){paint(ctx,cv.width,cv.height,dpr); $('#ph').hidden=strokes.length>0;}
function upd(){ $('#sGo').disabled=!($('#sName').value.trim().length>1&&$('#sOk').checked&&strokes.length); }
function exportImg(){
  const r=cv.getBoundingClientRect(), W=600, k=W/r.width, out=document.createElement('canvas'); out.width=W; out.height=Math.round(r.height*k);
  paint(out.getContext('2d'),out.width,out.height,k); return out.toDataURL('image/png');
}
const validMail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function doSign(){
  const name=$('#sName').value.trim(); if(name.length<2||!strokes.length) return;
  const email=$('#sMail').value.trim();
  if(email&&!validMail(email)){ const e=$('#sErr'); e.hidden=false; e.textContent="Cette adresse e-mail n'est pas valide. Corrigez-la ou laissez le champ vide."; $('#sMail').focus(); return; }
  const o={type:'devis-signe',number:DATA.q.number,signature:{img:exportImg(),name,signedAt:new Date().toISOString()}};
  saveSigned(o.number,o,false,email); finish(o,email);
}

/* ---------- PDF du devis signé ---------- */
const fmtTime=iso=>new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function signedBlock(o){
  return `<div class="signedblk"><div class="bpa">Bon pour accord</div><img src="${o.signature.img}" alt="Signature"><div class="who">${esc(o.signature.name)} · signé électroniquement le ${fmtDate(o.signature.signedAt.slice(0,10))} à ${fmtTime(o.signature.signedAt)}</div></div>`;
}
const pdfName=o=>`Devis-${o.number}-signe.pdf`.replace(/[^A-Za-z0-9._-]/g,'-');
async function buildPdf(o){
  if(!window.html2canvas||!window.jspdf) throw new Error('lib');
  const host=document.createElement('div'); host.className='pdfhost';
  host.innerHTML=quoteHTML(DATA.q,DATA.c)+signedBlock(o);
  document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
    const canvas=await html2canvas(host,{scale:1.6,backgroundColor:'#ffffff',useCORS:true,logging:false});
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), ih=canvas.height*pw/canvas.width;
    const img=canvas.toDataURL('image/jpeg',0.82);
    for(let y=0,p=0;y<ih-2;y+=ph,p++){ if(p) pdf.addPage(); pdf.addImage(img,'JPEG',0,-y,pw,ih); }
    const b64=pdf.output('datauristring').split('base64,')[1];
    return {blob:pdf.output('blob'),b64,name:pdfName(o)};
  } finally { host.remove(); }
}

/* ---------- Envoi au script Google ---------- */
async function sendToScript(o,pdf,email){
  const q=DATA.q, t=totals(q,!!DATA.c.noVat);
  const payload={type:'devis-signe',number:o.number,signature:o.signature,clientEmail:email||'',clientName:q.clientName||'',object:q.object||'',totalTtc:eur(t.ttc),pdf:pdf.b64,pdfName:pdf.name};
  const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(payload),redirect:'follow'});
  const j=await r.json(); return !!(j&&j.ok);
}
let CUR_PDF=null;
async function finish(o,email){
  renderDone(o,'sending',email);
  let pdf=null; try{ pdf=await buildPdf(o); CUR_PDF=pdf; }catch(e){ console.error('pdf',e); }
  if(!scriptOn()){ renderDone(o,'manual',email); return; }
  if(!pdf){ renderDone(o,'failed',email); return; }
  let ok=false; try{ ok=await sendToScript(o,pdf,email); }catch(e){ console.error('envoi',e); }
  if(ok) saveSigned(o.number,o,true,email);
  renderDone(o,ok?'sent':'failed',email);
}

/* ---------- Après signature ---------- */
function fileFor(o){return new File([JSON.stringify(o)],`Devis-signe-${o.number}.json`.replace(/[^A-Za-z0-9._-]/g,'-'),{type:'application/json'});}
function download(file){ const u=URL.createObjectURL(file); const a=document.createElement('a'); a.href=u; a.download=file.name||'fichier'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
function renderDone(o,state,email){
  const c=DATA.c, f=fileFor(o), phone=(c.phone||'').replace(/\D/g,'').replace(/^0/,'33');
  const subject=`Devis ${o.number} signé`, body=`Bonjour, voici le devis ${o.number} signé par ${o.signature.name}. Le fichier est joint.`;
  const head={
    sending:`<div class="msg"><span class="spin"></span>Envoi du devis signé en cours… ne fermez pas cette page.</div>`,
    sent:`<div class="msg ok">✓ Devis signé et envoyé à ${esc(c.name)}.${email?' Une copie avec le PDF vous a été envoyée par e-mail.':''}</div>`,
    failed:`<div class="msg warn">Votre signature est enregistrée, mais l'envoi automatique n'a pas pu être confirmé. Appuyez sur « Réessayer l'envoi » ou envoyez le fichier à la main (ci-dessous).</div>`,
    manual:`<div class="msg ok">✓ Devis signé. Dernière étape : envoyez le fichier à ${esc(c.name)}.</div>`
  }[state];
  const showManual=state==='manual'||state==='failed';
  $('#signZone').innerHTML=`<section class="card" id="doneCard">${head}
    <img class="sigthumb" src="${o.signature.img}" alt="Votre signature">
    ${state==='sending'?'':`<div class="row" style="margin-top:0">
      ${state==='failed'?`<button class="btn main" id="dRetry" type="button">Réessayer l'envoi</button>`:''}
      <button class="btn dark" id="dPdf" type="button">📄 Télécharger mon exemplaire (PDF)</button></div>`}
    ${showManual?`<div class="step"><div class="n">1</div><div class="c"><b>Envoyer le fichier signé</b>
        <button class="btn main" id="dShare" type="button" hidden>📤 Envoyer à ${esc(c.name)}</button>
        <button class="btn" id="dSave" type="button">💾 Enregistrer le fichier</button></div></div>
      <div class="step"><div class="n">2</div><div class="c"><b>Le transmettre (joignez le fichier enregistré)</b>
        <div class="row" style="margin-top:0">
          ${phone?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${phone}?text=${encodeURIComponent(body)}">💬 WhatsApp</a>`:''}
          ${c.email?`<a class="btn" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}">📧 E-mail</a>`:''}
        </div></div></div>
      <details style="margin-top:14px"><summary style="cursor:pointer;color:var(--muted)">Le fichier ne s'ouvre pas ? Copier le code à la place</summary>
        <textarea class="code" id="dCode" readonly></textarea><div class="row"><button class="btn" id="dCopy" type="button">Copier le code</button></div></details>`:''}
    <div class="msg err" id="dErr" hidden style="margin-top:12px"></div>
  </section>`;
  if(showManual){
    $('#dCode').value=JSON.stringify(o);
    try{ if(navigator.canShare&&navigator.canShare({files:[f]})) $('#dShare').hidden=false; }catch(e){}
    $('#dShare').onclick=async()=>{ try{ await navigator.share({files:[f],title:subject,text:body}); }catch(e){ if(!(e&&e.name==='AbortError')){ $('#dErr').hidden=false; $('#dErr').textContent="Le partage n'a pas fonctionné. Enregistrez le fichier puis envoyez-le par WhatsApp ou e-mail."; } } };
    $('#dSave').onclick=()=>download(f);
    $('#dCopy').onclick=async()=>{ const t=$('#dCode'); try{ await navigator.clipboard.writeText(t.value); $('#dCopy').textContent='Code copié ✓'; }catch(e){ t.select(); $('#dCopy').textContent='Sélectionné : copiez-le'; } };
  }
  if($('#dRetry')) $('#dRetry').onclick=()=>finish(o,email);
  if($('#dPdf')) $('#dPdf').onclick=async()=>{ const b=$('#dPdf'), old=b.textContent; b.disabled=true; b.textContent='Préparation du PDF…'; try{ const p=CUR_PDF||await buildPdf(o); CUR_PDF=p; download(new File([p.blob],p.name,{type:'application/pdf'})); }catch(e){ $('#dErr').hidden=false; $('#dErr').textContent="Le PDF n'a pas pu être créé sur cet appareil."; } b.disabled=false; b.textContent=old; };
  $('#doneCard').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- Démarrage ---------- */
async function start(){
  const app=$('#app');
  let d=null;
  try{ d=await readLink(); }catch(e){ d=undefined; }
  if(!d||!d.q||!d.q.number){
    app.innerHTML=`<section class="card"><h2 class="s">Lien de devis introuvable</h2>
      <div class="msg err">${d===undefined?'Ce lien est incomplet ou votre navigateur est trop ancien pour l\'ouvrir.':'Ce lien ne contient aucun devis.'}</div>
      <p class="hint" style="margin-top:12px">Demandez-nous de vous renvoyer le lien : ${esc(CO.phone)} · ${esc(CO.email)}</p></section>`;
    return;
  }
  DATA=d; document.title=`Devis ${d.q.number} · ${d.c.name}`;
  const expired=addDays(d.q.date||todayStr(),d.q.validity)<todayStr();
  app.innerHTML=quoteHTML(d.q,d.c)+`<div id="signZone"></div>`;
  const prev=loadSigned(d.q.number);
  if(prev&&prev.o){ renderDone(prev.o, prev.sent?'sent':(scriptOn()?'failed':'manual'), prev.email); }
  else { $('#signZone').innerHTML=signFormHTML(d.q,expired); setupPad(); }
}
window.addEventListener('hashchange',()=>location.reload());
start();
</script>
</body>
</html>
